# FrameWright 設定ファイル
# パスの ~ はホームディレクトリに展開されます

# 収録データの置き場所(リポジトリ外に置く。1収録=1フォルダ、中に raw.mkv)
# 複数の置き場所をランチャーで横断したい場合は recordingsDir の代わりに
# recordingsDirs を使う(併記不可)。先頭のキーが primary root になる。
# usb-siro1 は USB_SIRO1 が接続されているときだけランチャーに現れ、
# 未接続時は「未接続」表示で一覧からグレーアウトされる(落ちない)。
recordingsDirs:
  main: ~/Movies/framewright
  usb-siro1: /Volumes/USB_SIRO1/framewright
  usb-siro2: /Volumes/USB_SIRO2/framewright

# 収録レイアウトの設定。既定は通常動画(plain)。
# OBS拡張キャンバスを使う場合は各コマンドで --layout obs-canvas を指定するか、
# この layout を obs-canvas に変える。
# キャンバス 3840x1080: 左半分=画面キャプチャ、右半分=カメラ
# 収録設定を変えた場合は screenRegion/cameraRegion を合わせる(docs/recording-guide.md 参照)
ingest:
  screenRegion: { x: 0, y: 0, w: 1920, h: 1080 }
  cameraRegion: { x: 1920, y: 0, w: 1920, h: 1080 }
  # OBSの音声トラック番号(1始まり)。トラック1=マイク、トラック2=システム音声
  # トラック2は任意。収録ファイルに存在しなければ自動的に無視される
  micTrack: 1
  systemTrack: 2
  # 収録レイアウトの既定。plain(通常動画。カメラ無し。screenRegion は
  # 全フレーム) / obs-canvas(拡張キャンバス、上の screenRegion/cameraRegion
  # を使う) / auto(寸法/縦横比から OBS らしければ obs-canvas、それ以外は plain)。
  # 省略時 plain。ingest / editor / run の --layout フラグで実行時に上書きできる
  layout: plain
  # 映像ストリームを持たない音声 source を ingest したときの canvas。
  # 静止画 insert だけで構成するスライドショーの出力解像度・fpsになる
  stills:
    width: 1920
    height: 1080
    fps: 30

# 文字起こし(whisper.cpp)
whisper:
  bin: whisper-cli
  model: ~/Models/whisper/ggml-large-v3-turbo-q5_0.bin
  language: ja
  # 語/トークン単位のタイミング(transcript.json の segment.words[])を付けるか。
  # 既定 true(語タイムスタンプは karaoke/語境界カットの前提資産=W0)。
  # true だと whisper 実行が -ojf に切り替わり transcript.json が増える。
  # 既存収録(words 無し)は再 transcribe が要る(validate が警告する)。
  # 明示的に false を書けば従来どおり words を一切書かない挙動に戻せる
  wordTimestamps: true
  # DTW トークンアライメント(whisper.cpp の -dtw)。使用モデルに合う preset 名を
  # 書くと、各トークンに音響へ固定された t_dtw が入り、words[] の時刻が実発話に
  # 合う(注意ベースの既定タイムスタンプは文中で±数百ms〜秒単位でずれ、ポーズに
  # 語を等幅で塗り広げる=スクリプトタブの取り消し線の誤りの根本原因)。
  # flash attention と排他のため文字起こしは少し遅くなる。この行を消せば従来どおり
  dtw: large.v3.turbo
  # システム音声(systemTrack)も第2トラックとして文字起こしする(知覚専用・
  # 描画しない)。既定 false。true で transcript.system.json を書く
  systemAudio: false
  # テロップ粒度の割り直し(§src/lib/captionSplit.ts)。whisper は 1 発話を長い
  # まま 1 テロップにするので、これを「意味の切れ目で折った読みやすい 1 枚」へ
  # 割り直す。決定論処理(LLM も再文字起こしも使わない)で、
  #   1. 各境界に「区切りの強さ」を付ける
  #      句点 > 述語の終止形(です/ます) > 接続助詞(から/ので/けど) > 格助詞(は/を/に)
  #      > 連体の「の」。さらに無音の「間」を合成し、行頭禁則(小書き仮名・句読点・
  #      閉じ括弧)や語の途中(英数字・カタカナの連なり)は禁止にする
  #   2. その強さと断片長・表示秒から、全体のコストが最小になる分割を
  #      動的計画法(Knuth-Plass 型)で選ぶ
  # words[] があれば分割後の時刻は語境界そのもの。
  # この項目ごと消せば従来どおり分割しない(バイト等価)。
  captionSplit:
    # テロップは 1 行で描かれ自動折り返しをしないので、実質「1 行に収まる字数」。
    # 1920px 幅・既定フォントサイズならおおむね 24〜30 字が上限の目安
    maxChars: 26
    minChars: 10 # これ未満の断片は強く減点(ハード禁止ではない。省略時 maxChars*0.4)
    gapSec: 0.3 # 語間がこの秒未満の無音は「間」と数えない(words[] 依存)
    pauseFullSec: 0.8 # 語間がこの秒に達すると「間」の強さが最大になる(words[] 依存)
    minDurationSec: 0.9 # 表示がこの秒未満になる断片を減点(一瞬で消えるテロップの抑制)

# 無音検出(機械的カットの候補づくり)
detect:
  # この音量(dB)以下が minSilenceSec 秒以上続いたら無音とみなす
  silenceDb: -35
  minSilenceSec: 0.7
  # カット時に前後へ残す余白(秒)。詰まりすぎた編集になるのを防ぐ
  padSec: 0.15
  # これより短い「残す区間」は断片(呼吸音等)とみなして捨てる(秒)
  minKeepSec: 0.5
  # 発話候補の隙間(無音)を cutplan に cut として埋めるときの reason 文言。
  # この cut はエディタのタイムラインに印が出て「この区間を動画に戻す」で
  # 復元できる(元収録の全時間を keep/cut で連続被覆=全ての映像を戻せる状態)
  silenceCutReason: 無音
  # 収録ごとのsilencedetect無音占有率からthresholdを自動較正するopt-in。
  # 省略または enabled:false は上の silenceDb をそのまま使う従来動作。
  # 2026-07-17 有効化(V6 の前提。詳細は docs/programs/deterministic-calibration-program.md §10)
  calibration:
    enabled: true
    method: silencedetect-occupancy-v1
    floorOffsetDb: 12
  # 境界thresholdとは独立に、無音圧縮の時間3ノブだけをpresetで選ぶopt-in。
  # V4の gentle/balanced/tight は余白を広げる系列。compact-* は較正単独を
  # 起点に詰める系列(除去量は gentle < balanced < tight、全て実録discard 0)。
  # V6 の帰属を保つため、次の新規収録の V6 測定完了までは off(同 §10)。
  # silenceCompaction:
  #   enabled: true
  #   preset: compact-balanced
  #   # gentle | balanced | tight | compact-gentle | compact-balanced | compact-tight
  # keep 端を実音声 RMS の発話エッジ+padSec へ詰める opt-in(C7)。
  # 省略/false は従来の keep 端のまま(バイト等価)。測定系は boundary-check と同じ
  # (mono 8kHz PCM16LE / 100ms窓 p5 床)。
  # 相互作用は測定済み。V6 の帰属を保つため測定完了までは off(calibration-program §10)
  # edgeTrim:
  #   enabled: true
  #   floorOffsetDb: 12 # 発話とみなす閾値 = 床 + これ(dB)
  #   padSec: 0.1       # 発話エッジの外側へ残す余白(秒)
  #   maxTrimSec: 1.5   # 1辺あたりの最大トリム量(秒)

  # カット確認用プレビュー動画
preview:
  # 出力する横幅(px)の上限。拡張キャンバス全体(画面+カメラ横並び=3840px)を
  # この幅へ縮小するので、画面領域の実効解像度はこの半分になる。
  # 1280 だと画面が 640px 相当となり、エディタのプレビュー(1920 へ
  # アップスケール表示)で明確にぼやける。2560 で画面 1280px 相当。
  # 元収録がこれより小さい(縦長収録など)ときは拡大せず元のまま出す
  # (拡大しても情報は増えず、h264_videotoolbox の上限 4096px も超えるため)
  width: 2560
  # proxy.mp4 / preview.mp4 のビデオエンコーダ。videotoolbox は macOS の
  # ハードウェアエンコーダ。生成時間はほぼ同等でファイルサイズが小さい。
  # libx264 で従来の ultrafast+CRF に戻せる(実測は docs/perf.md 参照)
  videoEncoder: videotoolbox
  # proxy.mp4 をオールイントラ(GOP=1。全フレーム I)でエンコードするか。
  # エディタの frameSource は keep 境界ごとに proxy.mp4 を reseek して繋ぐため、
  # オールイントラだと直前キーフレームからのデコード待ちが無くなる
  # (代償はファイルサイズ増)。
  # false で従来の短 GOP エンコードに戻せる。preview.mp4 には影響しない
  proxyIntra: true

# 最終レンダー(engine 合成)のレイアウト
render:
  # 作成時の出力キャンバス。ingest --canvas が優先。作成後は固定
  # landscape / portrait / portrait-cover / portrait-screen / square / portrait-4x5
  canvas: landscape
  # 右下ワイプ(カメラ)の横幅(px、1920x1080基準)。ワイプは右下角に隙間なく配置される
  wipeWidthPx: 480
  # 字幕・テロップの画面端からの余白(px)。ワイプの位置には影響しない
  wipeMarginPx: 32
  # ワイプ全画面(overlays.json の wipeFull)の出入りの遷移時間(秒)。0で瞬時
  wipeTransitionSec: 0.3
  # カット境界(keep区間の継ぎ目)のトランジション。none で従来どおり瞬時切り替え。
  # dip-to-black で境界の前後に黒フェードを入れる(尺・音声は変わらない)。
  # sec は黒への往復の合計秒(前半でフェードアウト、後半でフェードイン)
  cutTransition:
    type: none
    sec: 0.3
  # 字幕のフォントサイズ(px)。初学者の見やすさ優先で大きめ
  captionFontSizePx: 48
  # テロップ既定の見た目(GUI エディタの設定画面 ⌘, からも変更できる)。
  # 個別のテロップ・トラック標準スタイルで指定の無い項目に効く
  captionColor: "#ffffff"
  captionOutlineColor: "none" # "none" で縁取りなし
  # Noto Sans JP を先頭に。同梱の可変フォント(assets/fonts/NotoSansJP.woff2、
  # wght 100〜900)なので fontWeight の 300/500/600/800 等の中間ウェイトが実際に
  # 描き分けられる。Hiragino は同梱フォント読込失敗時のフォールバック
  captionFontFamily: '"Noto Sans JP", "Hiragino Sans", "Hiragino Kaku Gothic ProN", sans-serif'
  # plan が章タイトルのテロップ(「章」トラック)を作るときの表示秒数
  chapterCardSec: 3
  # 音声ラウドネス正規化の目標値(LUFS)。YouTube の基準は -14
  # 収録音量が多少ばらついても、最終出力はこの音量に自動で揃う
  targetLufs: -14
  # システム音声(ingest.systemTrack で収録したアプリ音・デモ音)の扱い
  systemAudio:
    # true: 収録にシステム音声トラックがあればマイクと合成して出力に入れる
    # (render / preview / proxy 共通)。false: 従来どおりマイクのみ
    mix: true
    # 合成時のシステム音声の音量(dB)。0で原音量。合成後の全体が
    # targetLufs へ正規化されるので、ここでは声とのバランスだけを決める
    volumeDb: 0
  # マイク音声のノイズ除去(ffmpeg afftdn)。システム音声(アプリ音・デモ音)は
  # デジタル由来でノイズが無く、通すと音楽・効果音が劣化するため対象外
  denoise:
    # true でマイク音声にノイズ除去(ffmpeg afftdn)をかける。既定 false
    mic: false
    # afftdn のノイズフロア(dB)。下げるほど控えめ、上げるほど強い
    noiseFloorDb: -25
  # BGM。区間ごとに流すなら収録フォルダの bgm.json(tracks[]。区間・曲の
  # 切り替え・重奏ができる)。bgm.json が無ければ収録フォルダ直下の
  # bgm.mp3 / bgm.m4a / bgm.wav を全編1曲で流す(後方互換)。下の volumeDb /
  # fadeOutSec はその後方互換パスと、bgm.json で volumeDb 省略時の既定値
  bgm:
    # BGMの音量(dB)。0で原音量。声より20dB前後小さくするのが目安。
    # bgm.json の各区間で volumeDb を省いたときの既定にもなる
    volumeDb: -24
    # 全編1曲(後方互換)のときの動画終端フェードアウト秒数。
    # bgm.json では各区間の fadeOutSec で終端フェードを付ける
    fadeOutSec: 2
    # 発話中の自動ダッキング(無音検出 cuts.auto.json の発話区間で BGM を下げる)
    ducking:
      # 発話中にさらに下げる量(dB)。0 でダッキング無効
      duckDb: -8
      # 下げ・戻しにかける秒数
      fadeSec: 0.4
  # engine 合成段のハードウェアエンコーダ利用。if-possible: 使えれば使う
  # (macOS は VideoToolbox。使えない環境はソフトウェアへ自動フォールバック)。
  # disable: 常にソフトウェアエンコード(従来動作)。実測は docs/perf.md 参照
  hardwareAcceleration: if-possible
  # チャンク単位の差分レンダー(render chunk cache)。直前フルレンダー以降、
  # 映像に効く要素(テロップ・位置・ワイプ等)だけを変えた再実行で、変わった
  # チャンクだけを再レンダーして連結する。音声・keeps・全域設定を変えたときは
  # 自動でフルレンダーに戻る。chunkSec がチャンクの目標長(秒)。0 で無効。
  chunkSec: 15
  # ズーム演出(overlays.json の zooms)の既定設定。zooms[].easeSec/easeOutSec で
  # 個別指定があればそちらが優先する
  zoom:
    # OpenScreen 移植 D3: 入り/出の遷移秒数を非対称にする(Screen Studio 級の
    # 寄りの体感。入りが出より長い)。両方省略時の既定は easeInSec: 1.5 /
    # easeOutSec: 1.0。旧 easeSec(両方未指定のときだけ使う対称の後方互換値)
    easeInSec: 1.5
    easeOutSec: 1.0
    # ズーム中にカメラワイプを右下アンカーで縮める倍率(1 = 縮小なし)。
    # 縮小・復帰のトランジションは上の easeInSec/easeOutSec と共有する
    wipeScale: 0.8
    # OpenScreen 移植 D3(#2・D2a): 隣接ズームを連鎖(パン遷移)とみなす gap の
    # 上限(秒)。既定 1.5。厳密な隣接(gap=0)のときだけ連鎖させたい場合は
    # chainGapSec: 0 にする(旧仕様)
    # chainGapSec: 1.5
    # OpenScreen 移植 D3(#1・D1c): 先読み(pre-roll)。孤立ズームのイーズインを
    # 区間開始のこの秒だけ前から始める(「見せたい瞬間には既に寄り終わっている」)。
    # 既定 0.5。0 で無効(従来どおり区間開始から寄り始める)
    # leadSec: 0.5
    # OpenScreen 移植 D3(#2・D2b): gap のある連鎖(chainGapSec 以内だが完全隣接
    # ではない)のパン遷移秒数。既定 1.0。完全隣接(gap=0)には効かず
    # easeInSec を使う
    # chainPanSec: 1.0
    # baked(focusMode)ズーム中のワイプ縮小の下限。OpenScreen 逐語(1/scale・
    # 下限0.35)。1.0=縮小なし・0.55=穏やか
    webcamReactiveMinScale: 0.35
  # ベースレイアウトのデザイン(背景画像 + 画面パネル + カメラ角丸ワイプ)。
  # **OBS 拡張キャンバス収録(obs-canvas)だけ**に効く。plain 収録(OBS を
  # 通していない素の動画。スマホのショート動画等)は素材をそのまま見せる
  # ものなので、ここが true でも背景・パネルはかぶらない。ショートにも
  # 継承しない。既定 false = 各収録レイアウトの従来描画。
  # true にすると同梱の背景でそのまま動く(assets/backgrounds/)。
  #
  # design 静的資産が揃えば描画時に再利用される。資産生成失敗時は CSS 描画へ戻る
  # (§src/lib/design.ts)。
  design:
    enabled: true
    # false = 背景画像と画面の縁を外し、画面は全面表示。カメラワイプは維持する
    backgroundEnabled: true
    # 背景画像。省略時は backgroundColor の単色。3通りの書き方を解決する:
    #   assets/backgrounds/xxx.jpg … リポジトリ同梱の既定背景(誰の環境でも動く)
    #   ~/Movies/obs/xxx.jpg       … 自分のデザイン素材(絶対パス。~ は展開される)
    #   materials/xxx.jpg          … その収録フォルダ内のファイル
    # 収録フォルダ外のファイルは render.design/ へ自動コピーされてから合成される
    # (書き出しページは収録フォルダ配下を publicDir として読むため。§src/lib/designAsset.ts)
    backgroundFile: assets/backgrounds/teal.jpg
    backgroundColor: "#1b1b1f"
    screen:
      # 左右・下の余白(出力px)。高さは 16:9 維持の成り行き(上余白は 22px になる)
      marginXPx: 100
      marginBottomPx: 90
      radiusPx: 24
      shadow: true
    camera:
      # 一辺(出力px)。カメラ映像を正方形へ center-crop してこの大きさの角丸矩形にする
      sizePx: 375
      # 右・下からの余白(出力px)
      marginPx: 28
      # 角丸。sizePx/2 でクランプされ、そこが最大の丸み(= 円)になる
      radiusPx: 96
      # 落ち影(画面パネルの shadow とは独立)
      shadow: true
  captionFontWeight: 500
  captionBackground:
    color: rgba(35, 35, 35, 0.9)
    radiusPx: 20
    paddingPx: 52

# 画面 OCR(frames --ocr)。AI が画面内テキスト(コード/ターミナル/エラー)を
# テキストとして読むための Apple Vision OCR 設定。macOS 専用・オフライン。
# frames --ocr を使わない限り一切走らない(既定挙動は完全に不変)
ocr:
  # 認識言語の優先順(Vision の recognitionLanguages)。開発画面は英語コードが
  # 主で日本語テロップ/コメントが混在するので en 優先・ja 併記
  languages: [ ja, en ]

# 常駐フレームサーバ(frames-serve コマンド)。省略可(既定 4311)。
# 有効化フラグはここには置かない(opt-in は frames-serve の明示起動で
# 担保する。ポートを変えたいときだけ使う)
# frames:
#   serve:
#     port: 4311
#
#   # frames --scenes(画面の変化点+静止区間の代表を自動選択して撮る)の閾値。
#   # 全キー省略可・書かない限り既定値(コード側の DEFAULT_SCENE_SAMPLING_CFG。
#   # src/lib/sceneSampling.ts)がそのまま使われ、--scenes を使わない限り
#   # frames の既存挙動は完全に不変(video-perception-P0 §2.4)
#   scenes:
#     # scdet の sceneScore がこれ以上なら変化点とみなす。
#     # plan.cursor.scrollMotionThreshold(既定 0.4。誤爆を落とすので高め)より
#     # 低く取る(変化を拾いたいので低め、という非対称は意図的)
#     sceneThreshold: 0.25
#     # 変化点をこれ未満の間隔で連続採用しない。av.everySec(既定5)より
#     # 大きくすること(motion.json のグリッド自体が5秒間隔なので、これ以下
#     # だと間引きが1件も発生せず設定が死ぬ)。av.everySec を変えたらここも見直す
#     minGapSec: 6.0
#     # 1回の --scenes で撮る上限枚数。10分の収録で --every 10 が撮る60枚と
#     # 同数に揃えた(比較可能性のため)
#     maxShots: 60
#     # 静止区間にこの秒ごとに1枚(60秒未満の静止は1枚、3分以上の静止で
#     # frozenMaxShotsPerSpan 枚が上限になる式の一部)
#     frozenShotEverySec: 60
#     # 1つの静止区間から取る最大枚数
#     frozenMaxShotsPerSpan: 3

# カーソル座標の取得(record --watch)。OBS の録画ボタンに自動連動する常駐
# watcher。省略可(既定 localhost:4455・sampleIntervalMs 33)。macOS 専用
record:
  obsWebsocket:
    host: localhost
    port: 4455
    # OBS の「WebSocket サーバー設定」→「認証を有効にする」時のみ必須。
    # config.yaml は git 管理下のため平文パスワードは書かず、環境変数名を
    # 書く(実際の値は .env の OBS_WEBSOCKET_PASSWORD から読む)
    passwordEnv: OBS_WEBSOCKET_PASSWORD
  sampleIntervalMs: 33

# A/V フィードバック(av コマンド)。省略時はコード既定を使う
# av:
#   everySec: 5
#   cols: 5
#   windowSec: 1
#   scdetThreshold: 8
#   freeze:
#     noiseDb: -50
#     durationSec: 1
#   stripWidthPx: 320

# 画面状態の区間トラック(screen コマンド)。要 av <dir> の事前実行。省略可・
# 全キー省略可(既定値はコード側の DEFAULT_SCREEN_*。src/lib/config.ts)。
# frames.scenes とは別キー(同じ selectSceneTimes を呼ぶが較正の目標が違うため
# 独立に動かせる。video-perception-P1 §2.6)
# screen:
#   # OCR にかけるサンプル数の上限(= selectSceneTimes の maxShots)
#   maxSamples: 120
#   # selectSceneTimes へ渡す間引き間隔(秒)
#   minGapSec: 6.0
#   # 静止区間にこの秒ごとに1枚
#   frozenShotEverySec: 60
#   # 1つの静止区間から取る最大枚数
#   frozenMaxShotsPerSpan: 3
#   # 隣接サンプルの OCR 行 Jaccard 係数がこれ以上なら同一画面とみなす
#   mergeThreshold: 0.6
#   # 境界の追認に使う scene score
#   sceneThreshold: 0.25
#   # これ未満の区間は前へ吸収する。av.everySec 以下にすると吸収が機能しない
#   # (実行時に警告する。エラーにはしない)
#   minSegmentSec: 10.0
#   # index.json に載せる OCR 行数(全行は Layer 1 の ocr/*.json)
#   indexLines: 8
#   # `screen --summarize`(video-perception-P4。区間へ VLM 1 行要約を付ける)の
#   # コスト制御。`--summarize` を使わない限り一切読まれない(既定オフ=バイト等価)
#   summarize:
#     # 1回の --summarize で VLM に送る上限区間数。超過分は長い区間を優先する
#     maxSegments: 40
#     # 1回の VLM 呼び出しの出力トークン上限(1行40字なので既定は小さい)
#     maxOutputTokens: 64

# GUI エディタ(npm run editor)
editor:
  # 素材アップロード1ファイルの上限(MB)。動画素材も置けるよう大きめ。
  # ローカル限定サーバーだが、暴走したアップロードでディスクを埋めない歯止め
  maxUploadMb: 2048
  # プロジェクト作成時のベース動画・音声アップロード上限(MB)。長尺収録向けに別枠
  maxBaseUploadMb: 16384
  # タイムラインに置く画像素材・尺不明素材の既定の尺(秒)
  defaultImageDurationSec: 4
  defaultShortRangeSec: 10
  aiReview:
    vlm: false
    maxImages: 4
    maxRefinements: 3

# ショート動画の LLM ハイライト自動選定(plan-shorts コマンド)
planShorts:
  # 1本のショートの尺の上限(秒)。plan-shorts が LLM の選んだ区間集合の
  # 尺合計をこの値以下に収める(超過分は末尾の区間を落とす)。YouTube ショートは60秒
  maxDurationSec: 60

# plan(カット判断 LLM。plan / plan --cuts-only / remeta)へ発話以外の
# 知覚を添える。標準設定では audio/ocr を明示オンにする。
# 古い config でこの節自体が無い場合は互換のため全オフで動き、CLI が警告する
plan:
  # カットの積極度: safe(現状維持=ほぼ切らない、X4導入前とバイト等価) /
  # balanced(既定・明確な冗長は切る) / aggressive(テンポ最優先)。
  # rules.md / brief.md に「編集モード: aggressive」等の行があればそちらが優先
  editMode: balanced
  # 章(chapters.json + 動画上の「章」テロップ)を自動生成するか。
  # 既定 false=plan/remeta は章を作らない(タイトル案・概要欄は作る)。
  # 章立てが欲しいときだけ true。既存の chapters.json を手で持つ場合は影響しない
  chapters: false
  # カット判断と演出判断(plan-effects)に分類 id を使わせる共通スイッチ。
  # 既定 false=導入前とバイト等価。true で cut は reasonId(13分類)を
  # cutplan.json に、演出は effectReasonId(7分類)を生成した zoom/blur/annotation の
  # reasonId に記録する。none 判断は plan-effects.raw.txt に上限付きで残る
  reasonIds:
    enabled: true
  # 承認済みコーパスから抽出した style profile を候補選択のソフトな prior として注入
  # (目標ショット長・積極度・字幕密度/位置・冒頭フック・CTA 有無。brief.md に劣後)
  styleProfile:
    enabled: true # style.probe/default.json を使う(profile 省略時 "default")
  perception:
    audio: true # 無音・間の注記(決定論・追加依存なし。まずこれから)
    ocr: true # 画面OCRテキスト(macOS/Apple Vision 必要・区間数ぶん重い)
    ocrMaxSegments: 40
    ocrMaxLines: 6
    systemSpeech: false # システム音声の発話を plan に添える(要 whisper.systemAudio)
    cursor: false # カーソル操作(クリック/停留/待機カーソル比率)を plan に添える。
    #   要 record --watch の cursor サイドカー(無ければ警告なしでスキップ)
    # cursorDwell:            # 知覚用の dwell 閾値(演出用の plan.cursor とは別軸)
    #   minDwellMs: 600
    #   moveThreshold: 0.02
    # cursorWaitTypes: ["wait", "busybutclickable"]   # 待機系 cursorType(完全一致)
  # plan --cuts-only の観測→再調整ループ。省略/0/1 は従来の1ショット。
  # targetOutDurationSec は単発 plan にも surface される(設定するとプロンプトに
  # 「目標の出力尺」行が1行足される。ループが無効でも読まれる)
  # loop:
  #   maxIterations: 0
  #   targetOutDurationSec: null
  #   stopWhenAssertionsPass: true

  # cut 判断を tool+検証ループのエージェントにする(H1/H2)。既定 false=
  # 従来の単発/pushループ経路とバイト等価。要 ai の structured route が
  # anthropic 等 completeAgentic 対応アダプタ(非対応なら警告のうえ自動フォールバック)
  # harness:
  #   agentic: false
  #   maxToolCalls: 16   # 1生成ターンあたりの tool 呼び出し上限
  #   applySplit: false  # SD5(H6): 確信区間だけ候補内部を語境界で分割(R0 突破)。要 agentic:true + wordTimestamps。
  #                      # 既定 false=候補単位(SD4)とバイト等価。分割は apply+validate/assert が安全網
  #   maxSplits: 4       # 1ターンの分割上限(確信区間のみ=全面 apply 移行はしない)
  #   tools:
  #     frames: true
  #     av: true
  #     materials: true
  #     ocr: true

  # describe の任意露出(既定オフ=散文/--json ともバイト等価)
  # describe:
  #   pauses: false      # keep 内の間の位置と長さを出す
  #   pauseMax: 3
  #   pauseMinSec: 0.6
  #   screen: false      # 画面区間(screen.probe/index.json)を散文へ [画面] 行で出す
  #                      # (--json の screen キーはこの設定と無関係で、
  #                      #  screen.probe/index.json が在れば常に出る)

  # カーソル dwell(停留)からズーム候補を作る(plan-effects。OpenScreen移植D2)。
  # <recording base>.cursor.json サイドカー(record --watch)が無ければ一切
  # 参照されない。既定値は OpenScreen 自身のチューニング(30Hz・製品デモ向け)
  # なので、収録本数が増えたら再調整を検討する
  # 【調整メモ 2026-07-24】~/Movies/framewright/test で実測: 既定 max2600ms は
  # 「対象に置いて数秒〜十数秒しゃべる」チュートリアルの長い注視(このクリップは
  # 9.4秒の静止すらあった)を丸ごと除外し、dwell候補が7件しか出ない。上限を
  # 8000ms へ上げると10件に増える。長い注視こそズームしたい対象なので上限を緩和。
  cursor:
    minDwellMs: 450 # 停留とみなす最小継続時間
    maxDwellMs: 8000 # これを超えると意図的な作業とみなし除外(既定2600→8000。上記メモ)
    moveThreshold: 0.02 # 隣接サンプル間でこれを超える移動があれば停留を打ち切る
    spacingMs: 1800 # 採用済み候補の中心からこの間隔未満は間引く
    defaultScale: 2.5 # focus点からズーム rect を作るときの倍率
    clickBoost: 1.5 # クリック起点の dwell に与える strength 倍率(1で無効化)
    maxWindowMs: 3500 # dwell窓長の上限(ms)。clamp(総尺の5%,1000,これ)。追従(枝A)前の長尺ドリフト対策。A後は緩めてOpenScreenの5%へ戻せる
    scrollMotionThreshold: 0.4 # スクロール誤爆抑制の scene score 閾値。av.probe/motion.json があるときだけ効く。明白なスクロールだけ落とすゆるめの既定。誤爆が続くなら下げる
    autoZoom: true # 省略時 true。run(収録直後の初回一括)末尾でカーソル dwell 由来の
    #   zoom を自動配置する(cursorサイドカー有り・overlays.json の zooms 空のときだけ。
    #   手編集済みは絶対に上書きしない)。false で run の自動挿入だけを止める(閾値は
    #   plan-effects/autozoom コマンド自体には効き続ける別軸)

    # plan の候補格子を語タイムスタンプ(要 whisper.wordTimestamps)由来の語境界で
    # 細分化する(C1)+ 候補テキストを実際に残る語だけにする(C8)。
    # 既定 false=無音境界のみ(従来とバイト等価)。回帰基準線で on 比較してから既定化を検討
candidates:
  enabled: true
  splitOnlyLongerThanSec: 6 # これより長い候補だけを分割
  minSplitGapSec: 0.3 # 語間ギャップがこの秒以上なら分割点(無音検出が拾わない微小ポーズ)
  minCandidateSec: 0.5 # 分割後の最小尺(これ未満の断片は作らない)
  fillers: [ "えー", "えっと", "あの", "あのー", "まあ", "その", "なんか" ]

# 素材(B-roll)配置候補の自動生成(plan-materials)。要 materials <dir> --all の事前実行。
# 生成物は下書き(overlays[])で、採否は人間。cut/承認には触れない。
planMaterials:
  minSpanSec: 3.0 # 素材を置けるアンカーにする keep span の最小尺
  maxPlacements: 8 # 1回で作る overlay の上限(出しすぎ防止)
  defaultVolume: 0 # 素材音は既定で被せない(0=無音)
  defaultFit: contain
  # defaultRect: { x: 640, y: 40, w: 600, h: 338 }  # 省略=全画面。指定で PIP(ワイプ)

  # 素材の尺整合・dangling 検出(material-fit)。要 materials <dir> の事前実行。
  # 出力は apply パッチ下書き(material-fit.suggested.json)で、適用は人間が apply で行う。
materialFit:
  overrunEpsSec: 0.1 # 尺超過判定の許容誤差(秒)
  underrunRatio: 2.0 # 実尺が宣言尺の何倍で「大半未使用」とみなすか
  suggestUnderrunExtend: false # 尺不足で延長 set を出すか(既定は reason のみ)
  maxReplacements: 3 # dangling 貼り替え候補の上限

# 静止画クリップ(inserts[] に置いた画像)の生成時の既定尺と長尺警告。
# 既存の durationSec は書き換えない。
stills:
  defaultDurationSec: 5.0
  maxShareWarnRatio: 0.5 # 0 で長尺警告を無効化

# 演出(zoom/blur/annotation)候補の自動生成(plan-effects)。
# 要 frames --ocr / av の事前実行。生成物は下書きで、採否は人間。cut/承認に触れない。
planEffects:
  maxDecisions: 6 # 1回で作る演出の上限
  anchorWindowSec: 3.0 # アンカー時刻の前後に張る表示窓
  minSceneScore: 0.4 # motion アンカーにする sceneScore 下限
  minOcrBoxAreaPx: 8000 # OCR box をアンカーにする最小面積(小さい文字を除外)
  minZoomRect: { w: 480, h: 270 } # zoom rect の最小サイズ(拡大しすぎ防止)
  defaultBlurStrength: 0.5

# BGM 配置候補の自動生成(plan-bgm)。曲は人間が materials/ or bgm.* に置いたものだけ。
# 生成物は下書き(bgm.json)で、採否は人間。cut/承認に触れない。音量/duck は SD-B2。
planBgm:
  bigCutSec: 3.0 # 「大カット境界」とみなす cut 尺の下限(切替アンカー)
  minSlotSec: 8.0 # BGM スロットの最小尺(これ未満は前後へ吸収)
  maxSlots: 12 # スロット上限(区切りすぎ防止)

# 演出の検品(effect-check)。決定論チェックは常時、VLM は route があるときだけ。
effectCheck:
  densityWindowSec: 5.0 # 密度判定の窓(秒)
  maxPerWindow: 3 # 窓内の演出上限
  maxAnnotationSec: 8.0 # annotation 表示尺の上限
  minRectOverlapRatio: 0.3 # 「重なり」とみなす rect 交差率
  useVlm: true # VLM 二次確認(ai.routes.vision 不在なら自動で無効)

# 演出検品の提案ループ戻し(E7)。既定 off=バイト等価。on にすると
# plan-effects --observe / config どちらか true のときに、前回 effect-check
# の警告が次の演出生成の観測(参考情報。命令ではない)として渡る
effectReview:
  observe: false

# BGM の音量/被り/単調の検出と調整提案(bgm-fit)。要 av <dir> の事前実行。
# 出力は apply パッチ下書き(bgm-fit.suggested.json)で、適用は人間が apply で行う。
bgmFit:
  speechHeadroomDb: 8 # 発話 RMS を BGM がこの dB 下回るまで下げる(被り回避)
  silenceDuckDb: 3 # 無音区間で BGM を下げる量
  targetLufs: -14 # 全体ラウドネス目標(超過で loud 判定)
  minFadeSec: 1.0 # no-fade 判定で付ける fade 秒
  monotoneCoverRatio: 0.9 # 単一 file が総尺のこの割合超で monotone
  minChaptersForVariety: 3 # 章がこの数以上あると BGM 単調を警告
  # AI(意味カット・章立て・タイトル案・AI提案)
ai:
  # このセクションを丸ごと省略したときの既定は API(CLI ではない):
  #   ANTHROPIC_API_KEY があれば anthropic / claude-sonnet-5
  #   無くて OPENAI_API_KEY があれば openai / gpt-5.4-mini
  #   どちらも無ければ AI 呼び出し時にエラー(決定論だけの経路は動く)
  # CLI(claude-code / codex)を使いたいときは下のように明示する
  #
  # claude-code: Claude Code の `claude` CLI を使う(APIキー不要・画像は不可)
  # codex:       Codex CLI の `codex exec` を使う(実験的・画像は不可)
  # anthropic:   Anthropic API を使う(ANTHROPIC_API_KEY と model が必要)
  # openai:      OpenAI API を使う(OPENAI_API_KEY と model が必要)
  profiles:
    claude-code:
      adapter: claude-code
    codex:
      adapter: codex
    cloud-vision:
      adapter: openai
      model: gpt-5.4-mini
    openai-main:
      adapter: openai
      model: gpt-4.1
  routes:
    text: codex
    structured: codex
    vision: cloud-vision
  # 旧形式(後方互換):
  # provider: codex
  # auto: CLI provider の既定モデル。API provider ではモデル名を明示する
  # model: gpt-5.4-mini
  #
  # 推奨の新形式(profiles + routes)。text/structured/vision を分けられる。
  # profiles:
  #   local:
  #     adapter: openai-compatible
  #     protocol: chat-completions
  #     baseUrl: http://127.0.0.1:11434/v1
  #     model: qwen-local
  #     auth: { type: none }
  #     capabilities:
  #       structuredOutput: json-object
  #       imageInput: false
  #   cloud-vision:
  #     adapter: openai
  #     model: gpt-5.4-mini
  # routes:
  #   text: local
  #   structured: local
  #   vision: cloud-vision
  #
  # 接続確認:
  #   node src/cli.ts ai doctor
  #   node src/cli.ts ai doctor --route vision

  # ログ/可観測性。workflow(AI 呼び出し・ステージ・外部ツール)を stderr にどれだけ
  # 出すか。quiet=AI 行も抑止 / normal=AI+ステージ(既定) / verbose=ffmpeg・whisper・
  # headless Chrome まで1行ずつ。環境変数 FRAMEWRIGHT_LOG とグローバル --verbose/--quiet が
  # この設定より優先。stdout(describe --json 等の JSON 射影)は level に関わらず不変。
log:
  level: normal
